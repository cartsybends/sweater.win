name: Check private mode analytics
on:
  push:
    paths:
      - "backend/**"
      - "static/community-games/model.mjs"
      - "tests/community_games.mjs"
      - "tests/grid_popularity.mjs"
      - "analytics/**"
      - "tests/analytics*"
      - "tests/helpers/analytics_runtime.mjs"
      - "build_sweater.py"
      - ".github/workflows/analytics.yml"
  pull_request:
    paths:
      - "backend/**"
      - "static/community-games/model.mjs"
      - "tests/community_games.mjs"
      - "tests/grid_popularity.mjs"
      - "analytics/**"
      - "tests/analytics*"
      - "tests/helpers/analytics_runtime.mjs"
      - "build_sweater.py"
      - ".github/workflows/analytics.yml"
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: node tests/analytics_backend.mjs
      - run: node tests/community_games.mjs
      - run: node tests/grid_popularity.mjs
      - run: node tests/analytics_login.mjs
      - run: node tests/analytics_client.mjs
      - run: node tests/analytics_client_v2.mjs
      - run: node tests/analytics_insights.mjs
      - run: node tests/analytics_diagnostics.mjs
      - run: node tests/analytics_dashboard.mjs
      - run: node tests/who_scored.cjs
      - name: Package Worker without deploying
        run: SWEATER_D1_DATABASE_ID=00000000-0000-0000-0000-000000000000 npm --prefix backend run build
