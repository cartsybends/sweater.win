# Rebuilds Sweater from NHL.com every day and publishes it with GitHub Pages.
name: Update Sweater

on:
  schedule:
    - cron: "15 9 * * *"     # every day at 09:15 UTC (about 5 am Eastern)
  workflow_dispatch:          # lets you run it any time from the Actions tab
  push:
    branches: [main]
    paths:
      - "build_sweater.py"
      - "analytics/**"
      - "refresh_current_teams.py"
      - "make_preview_shell.py"
      - "static/who-scored/**"
      - "static/shootout/**"
      - "static/trophies/**"
      - "static/team-games/**"
      - "static/community-games/**"
      - "tools/community_games/**"
      - "tests/community_games*"
      - "tests/grid_popularity.mjs"
      - "grid_popularity.json"
      - "tools/team_games/**"
      - "tests/team_games.cjs"
      - "tests/team_careers.py"
      - "tests/shootout.cjs"
      - "tests/home_challenges.cjs"
      - "tests/frontend_regressions.cjs"
      - "tests/current_team_refresh.py"
      - "tests/who_scored_batches.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write             # persist generated schedules/caches back to the repo
  pages: write
  id-token: write

concurrency:
  group: sweater-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refresh verified Team Journey careers
        run: python tools/team_games/update_careers.py

      - name: Build the game from NHL.com
        run: python build_sweater.py --quiet --out site/index.html --site-url "${{ vars.SITE_URL }}" --api-url "${{ vars.API_URL }}"

      - name: Refresh current teams in archived and embedded player data
        run: python refresh_current_teams.py --html site/index.html --schedule schedule.json

      - name: Install video validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install Who Scored? image test dependency
        run: python -m pip install "Pillow>=11,<13"

      - name: Check Who Scored? round flow and rotations
        run: |
          node tests/who_scored.cjs
          python tests/who_scored_schedule.py
          python tests/who_scored_batches.py
          python tools/who_scored/validate.py

      - name: Check Shootout animation and round flow
        run: node tests/shootout.cjs

      - name: Check random home challenges and weekly progress
        run: node tests/home_challenges.cjs

      - name: Check frontend regression cases and player refresh persistence
        run: |
          node tests/frontend_regressions.cjs
          python tests/current_team_refresh.py

      - name: Check team mini-games and verified career order
        run: |
          node tests/team_games.cjs
          python tests/team_careers.py

      - name: Check Grid, Bench Boss, and Teammate Trail
        run: |
          node tests/community_games.mjs
          node tests/grid_popularity.mjs
          python -B tests/community_games_data.py

      - name: Validate generated JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          out = Path("/tmp/sweater-js")
          out.mkdir(exist_ok=True)

          written = 0
          for i, source in enumerate(scripts):
              if not source.strip():
                  continue
              path = out / f"script-{i}.js"
              path.write_text(source, encoding="utf-8")
              written += 1

          if not written:
              raise SystemExit("No inline JavaScript found in generated site.")
          print(f"Extracted {written} inline script(s) for syntax validation.")
          PY

          for file in /tmp/sweater-js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Make homepage preview-friendly
        run: python make_preview_shell.py --site site --site-url "${{ vars.SITE_URL }}"

      - name: Save schedules and NHL data caches
        shell: bash
        run: |
          git config user.name "sweater-bot"
          git config user.email "sweater-bot@users.noreply.github.com"

          cache_files=(
            schedule.json
            grid_popularity.json
            career_cache.json
            team_history_cache.json
            current_rosters.json
            lineup_cache.json
            edge_cache.json
            trophy_history.json
            team_careers.json
          )

          for file in "${cache_files[@]}"; do
            if [[ -f "$file" ]]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No schedule/cache changes to save."
          else
            git commit -m "Update Sweater schedules and NHL caches"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
