# Rebuilds Sweater from NHL.com every day and publishes it with GitHub Pages.
name: Update Sweater

on:
  schedule:
    - cron: "15 9 * * *"     # every day at 09:15 UTC (about 5 am Eastern)
  workflow_dispatch:          # lets you run it any time from the Actions tab
  push:
    branches: [main]          # rebuild whenever you upload a new build_sweater.py

permissions:
  contents: write             # save schedule.json and career_cache.json back to the repo
  pages: write
  id-token: write

concurrency:
  group: sweater-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the game from NHL.com
        run: python build_sweater.py --quiet --out site/index.html --site-url "${{ vars.SITE_URL }}"

      - name: Save the daily schedule and career history
        run: |
          git config user.name "sweater-bot"
          git config user.email "sweater-bot@users.noreply.github.com"
          git add schedule.json career_cache.json
          git diff --cached --quiet || git commit -m "Update daily schedule and player history"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
