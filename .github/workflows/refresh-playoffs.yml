name: Refresh NHL playoff probabilities

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sweater-playoff-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/playoffs/requirements.txt
      - run: python -m pip install -r tools/playoffs/requirements.txt
      - name: Identify historical season cache
        id: season
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo('America/New_York'))
          print('start=' + str(today.year if today.month >= 7 else today.year - 1))
          PY
      - uses: actions/cache@v4
        with:
          path: .cache/playoffs
          key: nhl-playoff-history-v1-${{ steps.season.outputs.start }}
      - name: Reconcile every completed game and update the forecast
        run: |
          python -B tools/playoffs/data.py
          python -B tests/playoffs_data.py --feed-only
      - name: Publish the verified forecast without rebuilding the site
        run: |
          git config user.name "sweater-bot"
          git config user.email "sweater-bot@users.noreply.github.com"
          git add playoffs_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Refresh NHL playoff probabilities"
            git pull --rebase
            git push
          fi
